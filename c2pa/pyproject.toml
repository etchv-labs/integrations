[project]
name = "etchv-c2pa"
version = "0.1.0"
description = "Recover a file's Content Credentials (C2PA) from its Etchv watermark through the public Soft Binding Resolution API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["c2pa-python>=0.38.2"]

[project.scripts]
etchv-c2pa = "etchv_c2pa.__main__:main"

[project.urls]
Homepage = "https://etchv.com/docs/guides/content-credentials?utm_source=c2pa&utm_medium=package&utm_campaign=integrations"
Source = "https://github.com/etchv-labs/integrations/tree/main/c2pa"

[build-system]
requires = ["hatchling>=1.33"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/etchv_c2pa"]
