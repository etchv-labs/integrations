name: Integrations CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm pack --dry-run ./n8n
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
          check-latest: true
      - run: python -m unittest discover -s c2pa/tests
